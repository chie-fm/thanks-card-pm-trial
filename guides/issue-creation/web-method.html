<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB画面での作成方法を選択 - GitHub Issue 作成ガイド</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f5f5f5;
            --surface2: #eeeeee;
            --border: #e0e0e0;
            --accent-gh: #0969da;
            --accent-linear: #6366f1;
            --accent-notion: #f59e0b;
            --text: #1a1a1a;
            --text-muted: #666666;
            --green: #059669;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 300;
            line-height: 1.7;
            min-height: 100vh;
        }

        /* ── HEADER ── */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 20px 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .back-link {
            color: var(--accent-gh);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--accent-linear);
        }

        /* ── CONTAINER ── */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 20px;
            color: var(--text);
        }

        .page-subtitle {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 60px;
            line-height: 1.8;
        }

        /* ── METHODS GRID ── */
        .methods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
            margin-bottom: 60px;
        }

        .method-card {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .method-card:hover {
            border-color: var(--accent-gh);
            box-shadow: 0 12px 32px rgba(9, 105, 218, 0.12);
            transform: translateY(-4px);
        }

        .method-icon {
            font-size: 56px;
            margin-bottom: 20px;
        }

        .method-title {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text);
        }

        .method-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.8;
        }

        /* ── FOOTER ── */
        footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 40px 60px;
            text-align: center;
            margin-top: 60px;
        }

        .footer-content {
            max-width: 900px;
            margin: 0 auto;
            font-size: 13px;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            .page-title {
                font-size: 28px;
            }

            header {
                padding: 15px 20px;
            }

            .methods-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-content">
            <div class="header-title">WEB画面での Issue 作成</div>
            <a href="issue-creation-guide.html" class="back-link">← ガイドに戻る</a>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">WEB 画面で Issue を作成</h1>
        <p class="page-subtitle">どのような Issue を作成しますか？下記から選択してください。</p>

        <div class="methods-grid">
            <!-- NEW ISSUE -->
            <a href="web-issue-creation.html" class="method-card">
                <div class="method-icon">✨</div>
                <h3 class="method-title">新規 Issue を作成</h3>
                <p class="method-desc">新しい Issue をゼロから作成する手順です。GitHub の WEB 画面で直感的に操作できます。</p>
            </a>

            <!-- SUB-ISSUE -->
            <a href="web-sub-issue-creation.html" class="method-card">
                <div class="method-icon">🔗</div>
                <h3 class="method-title">Sub-issue を作成</h3>
                <p class="method-desc">既存の Issue に子 Issue として新しい Sub-issue を作成する手順です。親子関係を設定します。</p>
            </a>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p>GitHub Issue 作成ガイド | WEB画面での作成方法</p>
        </div>
    </footer>
</body>

</html>
